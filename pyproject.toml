[build-system]
requires = ["meson-python", "vapoursynth"]
build-backend = "mesonpy"

[project]
name = "vapoursynth-decross"
description = "Spatio-temporal cross color (rainbow) reduction filter for VapourSynth."
readme = "readme.rst"
requires-python = ">=3.12"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
authors = [
    {name = "cantabile", email = "cantabile.desu@gmail.com"},
]
maintainers = [
    {name = "Fredrik Mellbin", email = "fredrik.mellbin@gmail.com"},
]
keywords = ["video", "derainbow", "rainbow", "crosscolor"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Plugins",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Programming Language :: C++",
    "Topic :: Multimedia :: Video",
]
dependencies = ["VapourSynth"]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/dubhatervapoursynth/vapoursynth-decross.git"
Issues = "https://github.com/dubhatervapoursynth/vapoursynth-decross/issues"

[tool.meson-python.wheel]
exclude = ["*/*.dll.a", "*/*.lib"]
